note: >-
  The API itself has no published lifecycle policy. The only versioning signal on the API is the URI
  segment /api/v1/ and info.version "v1"; there is no changelog for the API, no deprecation or sunset
  policy, no SLA and no status page. What IS published and dated is the Python SDK's lifecycle — a Keep a
  Changelog file following Semantic Versioning, with six GitLab releases. Do not read SDK versioning as API
  versioning; they are separate artifacts and only the SDK is versioned in public.
