aid: calendar-api-ma
name: API Calendrier Marocain | Jours Fériés & Ouvrables REST + SDK Python
description: 'Calendar API is a REST service from Unravel Designs (Casablanca, Morocco) that turns the
  Moroccan economic calendar into a callable contract. It returns national, religious and exceptional
  public holidays with an explicit Estimated/Official status — religious feasts are dated astronomically
  and only become Official after moon sighting — and it calculates open business days: next and previous
  working day, counts and listings between two dates, and CalSpan, a chainable business-day [start_date,
  end_date] interval for a month, quarter, semester or year that drops straight into a SQL BETWEEN. Fourteen
  read-only GET operations are described by a published OpenAPI 3.1 document, authenticated with an X-API-KEY
  header, and wrapped by a typed first-party Python SDK (pycalendar-api). It is aimed at data engineers
  wiring Moroccan holiday logic into ETL pipelines and orchestrators such as Airflow and Dagster, and
  at regulated-market reporting where a hardcoded holiday table quietly goes stale every year.'
