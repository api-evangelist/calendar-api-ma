  - {from: IsHoliday, to: CalHolidayStatus, type: has_one, via: status}
  - {from: DaysCount, to: CalFreq, type: has_one, via: freq}
  - {from: SerieDatesEng, to: CalFreq, type: has_one, via: freq}
  - {from: CalSpan, to: CalMode, type: has_one, via: mode_calendar}
