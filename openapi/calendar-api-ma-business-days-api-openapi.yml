          type: integer
          maximum: 9999.0
          minimum: 1.0
          title: year
          description: Year
          examples:
          - 2025
          - 2026
        description: Year
        required: true
        deprecated: false
        examples:
          year-example-1:
            summary: Year 2025
            value: 2025
          year-example-2:
            summary: Year 2026
            value: 2026
      - name: month
        in: path
        schema:
          oneOf:
          - type: integer
          - type: 'null'
          maximum: 12
          minimum: 1
          description: Month of the Year
          examples:
          - 1
          - 7
        description: Month of the Year
        required: true
        deprecated: false
        examples:
          month-example-1:
            summary: January
            value: 1
          month-example-2:
            summary: July
            value: 7
      responses:
        '200':
          description: Request fulfilled, document follows
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerieDatesEng'
        '400':
          description: Bad request syntax or unsupported method
          content:
            application/json:
              schema:
