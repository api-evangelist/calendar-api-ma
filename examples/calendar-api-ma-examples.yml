sdk_examples:
  language: python
  package: pycalendar-api
  source: https://calendar-api.ma/
  note: Provider-published samples, quoted with the return values the provider prints in its own documentation.
  samples:
    - title: Check whether a date is a holiday
      code: |
        from pycalendar_api import CalendarApi, to_date
        api = CalendarApi('YOUR_API_KEY')
        result = api.holidays.is_holiday(to_date('14/01/2025'))
      returns: >-
        HolidayCheckResult(is_holiday=True, description="Nouvel An Amazigh", holiday_type='National',
        status='Official')
    - title: Next open business day
      code: |
        from pycalendar_api import CalendarApi, to_date
        api = CalendarApi.from_env()   # export PYCALENDAR_APIKEY=YOUR_API_KEY
        nxt = api.bdays.next_date(to_date('13/01/2025'))
      returns: NextDate(date=datetime.date(2025, 1, 13), next_date=datetime.date(2025, 1, 15))
    - title: Previous open business day
      code: |
        prev = api.bdays.previous_date(to_date('15/01/2025'))
      returns: PreviousDate(date=datetime.date(2025, 1, 15), previous_date=datetime.date(2025, 1, 13))
    - title: Count business days across a year
      code: |
        count = api.bdays.count(to_date('02/01/2025'), to_date('31/12/2025'))
      returns: DaysCount(start_date=datetime.date(2025, 1, 2), end_date=datetime.date(2025, 12, 31), count=247)
    - title: Business days of a month
      code: |
        june = api.bdays.bdays_of(2025, month=6)
      returns: >-
        DateSeries(ref='bdays-2025-06', min_date=datetime.date(2025, 6, 2),
        max_date=datetime.date(2025, 6, 30), items=19, serie=SortedSet([...]))
    - title: Span of a quarter
      code: |
        span = api.bdays.span(2025, quarter=3)
      returns: >-
        CalSpan(start_date=datetime.date(2025, 6, 30), end_date=datetime.date(2025, 9, 30), year=2025,
        semester=None, quarter=3, month=None)
    - title: List a year's holidays and isolate the estimated religious ones
      code: |
        holidays = api.holidays.year(2025)
        religious = [h for h in holidays if h.holiday_type == 'Religious']
        estimated = [h for h in religious if h.status == 'Estimated']
      note: The provider recommends hourly polling until status flips to Official.
