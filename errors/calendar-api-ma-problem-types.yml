  application/json. The published spec declares a 400 on all 13 v1 operations (and none on /health);
  no 401, 403, 404, 429 or 5xx response is declared, though a 401 is demonstrably returned live. There is
  no error-code registry — `detail` is free text and there is no stable machine-readable code, so an agent
  must branch on the HTTP status, not on a symbol.
