components:
  schemas:
    DaysCount:
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        count:
          type: integer
        freq:
          $ref: '#/components/schemas/CalFreq'
      type: object
      required:
      - count
      - end_date
      - freq
      - start_date
      title: DaysCount
    CalMode:
      type: string
      enum:
      - D
      - W
      title: CalMode
      description: "The Mode used by the Fin Calendar to calulate the reference dates of dynamic periods. i.e: 3:M, 23:W, 12:Y, ...\n\n    Enums:\n    - D: The calculation is based on open `dailies` dates. Similar to any Business days based calendar\n    - W: The calculation is based on the `weeklies` (**Fridays**). Returns the last weekdate related to the provided `period`\n    "
    CalFreq:
      type: string
      enum:
      - ND
      - D
      - W
      - M
      - Q
      - S
      - Y
      title: CalFreq
      description: "Frequency\n\n    Enums:\n        - D: DAILY\n        - W: WEEKLY\n        - M: MONTHLY\n        - Q: QUARTERLY\n        - S: SEMI-ANNUALLY\n        - Y: YEARLY\n    "
    SerieDatesEng:
      properties:
        ref:
          type: string
        min_date:
          type: string
          format: date
        max_date:
          type: string
          format: date
        freq:
          $ref: '#/components/schemas/CalFreq'
        nitems:
          type: integer
        serie:
          items:
            type: string
            format: date
          type: array
      type: object
      required:
      - ref
      title: SerieDatesEng
    PreviousDate:
      properties:
        date:
          type: string
          format: date
        previous_date:
          type: string
          format: date
      type: object
      required:
      - date
      - previous_date
      title: PreviousDate
    NextDate:
      properties:
        date:
          type: string
          format: date
        next_date:
          type: string
          format: date
      type: object
      required:
      - date
      - next_date
      title: NextDate
    CalSpan:
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        year:
          type: integer
        semester:
          type: integer
        quarter:
          type: integer
        month:
          type: integer
        mode_calendar:
          $ref: '#/components/schemas/CalMode'
        country_code:
          type: string
      type: object
      required:
      - country_code
      - end_date
      - mode_calendar
      - month
      - quarter
      - semester
      - start_date
      - year
      title: CalSpan
  securitySchemes:
