      breakdown and no subscription channel.
    health_endpoint: https://calendar-api.ma/health
  sla:
    published: false
    note: >-
      No public SLA. The contact page offers "SLA dédié" (dedicated SLA), white labeling and on-prem or
      managed deployment as an enterprise conversation — https://calendar-api.ma/contacts.html — so terms
      exist only under a sales discussion.
  data_history:
    note: >-
      Holidays follow an SCD Type 2 history model. Religious holidays are qualified from 2006 onward and the
      provider states coverage will be extended back to 1985. Future religious holidays carry status
      "Estimated" until moon sighting confirms them, then flip to "Official"; the provider documents hourly
      polling as the pattern for production systems that cannot tolerate a one-day shift.
    source: https://docs.calendar-api.ma/how-it-works/
