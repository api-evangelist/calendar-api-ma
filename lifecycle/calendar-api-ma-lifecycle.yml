  status_page:
    published: false
    note: >-
      No status page exists — https://calendar-api.ma/status returns 404 and no status.* subdomain or
      third-party status host is linked from the site. The API does expose an unauthenticated liveness
      endpoint, GET /health, returning {"api_status":"UP","appname":"calendar-api"} (HTTP 200 observed
