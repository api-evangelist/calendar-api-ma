note: >-
  Calendar API publishes NO rate limits. The marketing site, both product guides, the SDK documentation and
  the OpenAPI description were all read and none states a request ceiling, quota, burst allowance or
  throttling behaviour. No 429 response is declared anywhere in the spec. No RateLimit-*, X-RateLimit-* or
  Retry-After header was returned on any observed response (200 on /health, 401 on an unauthenticated v1
  call) — the observed header set is only Server, Date, Content-Type, Content-Length, Connection and a
  csrftoken cookie. The only quantified account limit published anywhere is 5 API keys per account, which is
  a key allowance, not a request rate. This matters more than usual here: the provider's own documented
  integration pattern is HOURLY POLLING to watch a religious holiday flip from Estimated to Official, and a
  consumer building that loop has no published budget to size it against.
